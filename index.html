<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消化系專科醫師筆試 - 歷屆題庫與錯題本系統</title>
    <style>
        :root {
            --primary: #1976d2;
            --success: #2e7d32;
            --danger: #c62828;
            --star: #f59e0b;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 820px;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 24px 30px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--primary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .star-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: #cbd5e1;
            transition: color 0.15s ease;
            line-height: 1;
            padding: 0 4px;
        }

        .star-btn.bookmarked {
            color: var(--star);
        }

        .filter-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 18px;
            font-size: 0.95rem;
            flex-wrap: wrap;
        }

        select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
            background-color: #fff;
        }

        .btn-tool {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-tool:hover {
            background-color: #f1f5f9;
            border-color: #94a3b8;
            color: var(--primary);
        }

        .btn-tool.danger:hover {
            color: var(--danger);
            border-color: #fca5a5;
        }

        .question-title {
            font-size: 1.05rem;
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .statements {
            background-color: #f1f5f9;
            border-left: 4px solid var(--primary);
            padding: 10px 14px;
            border-radius: 0 6px 6px 0;
            margin-bottom: 16px;
            line-height: 1.6;
            font-size: 0.92rem;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #ffffff;
            border: 1.5px solid #e2e8f0;
            padding: 12px 16px;
            border-radius: 8px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--text);
            line-height: 1.4;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f8fafc;
            border-color: #94a3b8;
        }

        .option-btn.selected {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .option-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success) !important;
            color: var(--success);
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: var(--danger);
            font-weight: bold;
        }

        .result-panel {
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: 8px;
            display: none;
            line-height: 1.5;
        }

        .result-panel.correct {
            background-color: #f0fdf4;
            color: var(--success);
            border: 1px solid #bbf7d0;
        }

        .result-panel.wrong {
            background-color: #fef2f2;
            color: var(--danger);
            border: 1px solid #fecaca;
        }

        .actions {
            margin-top: 22px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 9px 22px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.15s;
        }

        .action-btn:hover {
            background-color: #1565c0;
        }

        .action-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .action-btn.secondary {
            background-color: #ffffff;
            color: #64748b;
            border: 1.5px solid #cbd5e1;
        }

        .action-btn.secondary:hover {
            background-color: #f1f5f9;
            color: #1e293b;
            border-color: #94a3b8;
        }

        .stats-bar {
            margin-top: 14px;
            font-size: 0.85rem;
            color: #64748b;
            display: flex;
            justify-content: space-between;
        }
    </style>
    <!-- 引入題庫檔案 -->
    <script src="questions.js"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>消化系專科醫師歷屆甄審</h1>
        <div class="header-right">
            <button class="star-btn" id="star-btn" onclick="toggleCurrentBookmark()" title="收藏至錯題本">★</button>
            <span class="badge" id="source-badge">題號資訊</span>
        </div>
    </div>

    <div class="filter-row">
        <label for="year-select">練習範圍：</label>
        <select id="year-select" onchange="onYearChange()">
            <option value="all">全部年度 (隨機)</option>
            <option value="mistakes" style="color: #b45309; font-weight: bold;">★ 我的錯題本</option>
            <option value="113">113 年度</option>
            <option value="112">112 年度</option>
            <option value="111">111 年度</option>
            <option value="110">110 年度</option>
            <option value="109">109 年度</option>
            <option value="108">108 年度</option>
            <option value="107">107 年度</option>
            <option value="106">106 年度</option>
        </select>
        <button class="btn-tool" onclick="exportMistakes()" title="下載錯題本記錄檔">匯出錯題</button>
        <button class="btn-tool" onclick="document.getElementById('import-file').click()" title="載入錯題本記錄檔">匯入錯題</button>
        <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importMistakes(event)">
        <button class="btn-tool danger" onclick="clearAllMistakes()">清空錯題</button>
    </div>

    <div class="question-box">
        <div class="question-title" id="question-text">載入中...</div>
        <div class="statements" id="question-statements" style="display: none;"></div>
        <div class="options-group" id="options-container"></div>
    </div>

    <div class="result-panel" id="result-box">
        <div id="result-msg"></div>
    </div>

    <div class="actions">
        <!-- 新增：跳過此題按鈕 -->
        <button class="action-btn secondary" id="skip-btn" onclick="skipQuestion()">跳過此題</button>
        <button class="action-btn" id="submit-btn" disabled>送出答案</button>
        <button class="action-btn" id="next-btn" style="display: none;">下一題</button>
    </div>

    <div class="stats-bar">
        <span id="bank-info">可抽題數：0 題</span>
        <span id="score-box">答對率：0 / 0 (0%)</span>
    </div>
</div>

<script>
let currentPool = [];
let currentQuestion = null;
let selectedOption = null;
let stats = { total: 0, correct: 0 };

const STORAGE_KEY = "GI_EXAM_MISTAKES";

function getMistakeKeys() {
    try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
        return [];
    }
}

function saveMistakeKeys(keys) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(keys));
    updateMistakesOptionText();
}

function getQuestionKey(q) {
    return `${q.year}_${q.no}`;
}

function isBookmarked(q) {
    if (!q) return false;
    const list = getMistakeKeys();
    return list.includes(getQuestionKey(q));
}

function toggleCurrentBookmark() {
    if (!currentQuestion) return;
    const key = getQuestionKey(currentQuestion);
    let list = getMistakeKeys();
    
    if (list.includes(key)) {
        list = list.filter(k => k !== key);
    } else {
        list.push(key);
    }
    saveMistakeKeys(list);
    updateStarUI();

    if (document.getElementById("year-select").value === "mistakes") {
        filterPool();
    }
}

function addCurrentToMistakes() {
    if (!currentQuestion) return;
    const key = getQuestionKey(currentQuestion);
    let list = getMistakeKeys();
    if (!list.includes(key)) {
        list.push(key);
        saveMistakeKeys(list);
        updateStarUI();
    }
}

function exportMistakes() {
    const list = getMistakeKeys();
    if (list.length === 0) {
        alert("目前錯題本是空的，沒有可匯出的紀錄！");
        return;
    }
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(list, null, 2));
    const downloadAnchor = document.createElement("a");
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `gi_exam_mistakes_${new Date().toISOString().slice(0, 10)}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}

function importMistakes(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const imported = JSON.parse(e.target.result);
            if (!Array.isArray(imported)) {
                throw new Error("格式不正確");
            }
            const current = getMistakeKeys();
            const shouldMerge = confirm(`成功讀取檔案！\n檔案內共有 ${imported.length} 筆錯題紀錄。\n\n按「確定」將檔案與目前紀錄【合併】\n按「取消」將【覆蓋】目前的紀錄`);
            
            let finalList = [];
            if (shouldMerge) {
                finalList = Array.from(new Set([...current, ...imported]));
            } else {
                finalList = imported;
            }

            saveMistakeKeys(finalList);
            alert(`匯入完成！目前錯題本共有 ${finalList.length} 題。`);
            
            if (document.getElementById("year-select").value === "mistakes") {
                onYearChange();
            } else {
                updateStarUI();
            }
        } catch (err) {
            alert("匯入失敗：請確認檔案是否為先前匯出的 .json 紀錄檔！");
        }
        event.target.value = "";
    };
    reader.readAsText(file);
}

function clearAllMistakes() {
    if (confirm("確定要清空所有已收藏的錯題嗎？")) {
        localStorage.removeItem(STORAGE_KEY);
        updateMistakesOptionText();
        if (document.getElementById("year-select").value === "mistakes") {
            onYearChange();
        } else {
            updateStarUI();
        }
    }
}

function updateMistakesOptionText() {
    const count = getMistakeKeys().length;
    const opt = document.querySelector("#year-select option[value='mistakes']");
    if (opt) {
        opt.innerText = `★ 我的錯題本 (${count} 題)`;
    }
}

function updateStarUI() {
    const starBtn = document.getElementById("star-btn");
    if (isBookmarked(currentQuestion)) {
        starBtn.classList.add("bookmarked");
        starBtn.title = "已在錯題本中 (點擊取消)";
    } else {
        starBtn.classList.remove("bookmarked");
        starBtn.title = "加入錯題本";
    }
}

function initBank() {
    if (typeof rawQuestions === "undefined" || !rawQuestions.length) {
        alert("找不到 questions.js 或題庫內容為空！請確保 questions.js 與此 html 放在同一資料夾中。");
        return;
    }
    updateMistakesOptionText();
    onYearChange();
}

function onYearChange() {
    filterPool();
    loadRandomQuestion();
}

function filterPool() {
    const mode = document.getElementById("year-select").value;
    if (mode === "all") {
        currentPool = rawQuestions;
    } else if (mode === "mistakes") {
        const mistakeKeys = getMistakeKeys();
        currentPool = rawQuestions.filter(q => mistakeKeys.includes(getQuestionKey(q)));
    } else {
        currentPool = rawQuestions.filter(q => q.year.includes(mode));
    }
    document.getElementById("bank-info").innerText = `可抽題數：${currentPool.length} 題`;
}

// 跳過此題功能：不計入統計，直接抽下一題
function skipQuestion() {
    loadRandomQuestion();
}

function loadRandomQuestion() {
    if (currentPool.length === 0) {
        const mode = document.getElementById("year-select").value;
        if (mode === "mistakes") {
            document.getElementById("question-text").innerText = "太棒了！錯題本內目前沒有任何題目。";
        } else {
            document.getElementById("question-text").innerText = "該類別目前無題目。";
        }
        document.getElementById("question-statements").style.display = "none";
        document.getElementById("options-container").innerHTML = "";
        document.getElementById("source-badge").innerText = "無題目";
        document.getElementById("submit-btn").style.display = "none";
        document.getElementById("skip-btn").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("result-box").style.display = "none";
        updateStarUI();
        return;
    }

    selectedOption = null;
    document.getElementById("submit-btn").disabled = true;
    document.getElementById("submit-btn").style.display = "inline-block";
    document.getElementById("skip-btn").style.display = "inline-block";
    document.getElementById("next-btn").style.display = "none";
    document.getElementById("result-box").style.display = "none";

    const randomIndex = Math.floor(Math.random() * currentPool.length);
    currentQuestion = currentPool[randomIndex];

    updateStarUI();

    document.getElementById("source-badge").innerText = `${currentQuestion.year} 第 ${currentQuestion.no} 題`;
    document.getElementById("question-text").innerText = currentQuestion.question;

    const stmtBox = document.getElementById("question-statements");
    if (currentQuestion.statements && currentQuestion.statements.length > 0) {
        stmtBox.innerHTML = currentQuestion.statements.map(s => `<div>${s}</div>`).join("");
        stmtBox.style.display = "block";
    } else {
        stmtBox.style.display = "none";
    }

    const optContainer = document.getElementById("options-container");
    optContainer.innerHTML = "";

    currentQuestion.options.forEach((optText) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = optText;
        const optKey = optText.trim().charAt(0).toUpperCase();

        btn.onclick = () => {
            document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            selectedOption = optKey;
            document.getElementById("submit-btn").disabled = false;
        };

        optContainer.appendChild(btn);
    });
}

function checkAnswer() {
    if (!selectedOption) return;

    stats.total++;
    const isCorrect = (selectedOption === currentQuestion.answer.toUpperCase());
    if (isCorrect) stats.correct++;

    if (!isCorrect) {
        addCurrentToMistakes();
    }

    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach(btn => {
        btn.disabled = true;
        const optKey = btn.innerText.trim().charAt(0).toUpperCase();
        if (optKey === currentQuestion.answer.toUpperCase()) {
            btn.classList.add("correct");
        } else if (optKey === selectedOption && !isCorrect) {
            btn.classList.add("wrong");
        }
    });

    const resultBox = document.getElementById("result-box");
    const resultMsg = document.getElementById("result-msg");
    resultBox.style.display = "block";

    if (isCorrect) {
        resultBox.className = "result-panel correct";
        resultMsg.innerHTML = `<strong>回答正確！</strong> 正確答案為 <b>${currentQuestion.answer}</b>。`;
    } else {
        resultBox.className = "result-panel wrong";
        resultMsg.innerHTML = `<strong>回答錯誤！</strong> 您的答案是 ${selectedOption}，正確答案為 <b>${currentQuestion.answer}</b>。<br><small style="color: #991b1b;">(已自動將此題存入「錯題本」)</small>`;
    }

    const rate = Math.round((stats.correct / stats.total) * 100);
    document.getElementById("score-box").innerText = `答對率：${stats.correct} / ${stats.total} (${rate}%)`;

    // 送出後：隱藏「送出」與「跳過」，顯示「下一題」
    document.getElementById("submit-btn").style.display = "none";
    document.getElementById("skip-btn").style.display = "none";
    document.getElementById("next-btn").style.display = "inline-block";
}

document.getElementById("submit-btn").onclick = checkAnswer;
document.getElementById("next-btn").onclick = () => {
    loadRandomQuestion();
};

window.onload = initBank;
</script>

</body>
</html>
