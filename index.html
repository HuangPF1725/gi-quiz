<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消化系專科醫師筆試 - 歷屆題庫與錯題本系統</title>
    <style>
        :root {
            --primary: #1976d2;
            --success: #2e7d32;
            --danger: #c62828;
            --star: #f59e0b;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 820px;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 24px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 1.15rem;
            margin: 0;
            color: var(--primary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .star-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: #cbd5e1;
            transition: color 0.15s ease;
            line-height: 1;
            padding: 0 4px;
        }

        .star-btn.bookmarked {
            color: var(--star);
        }

        .filter-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 16px;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }

        .range-container {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
            background-color: #fff;
        }

        .btn-tool {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-tool:hover {
            background-color: #f1f5f9;
            border-color: #94a3b8;
            color: var(--primary);
        }

        .btn-tool.danger:hover {
            color: var(--danger);
            border-color: #fca5a5;
        }

        .question-title {
            font-size: 1.05rem;
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .statements {
            background-color: #f1f5f9;
            border-left: 4px solid var(--primary);
            padding: 10px 14px;
            border-radius: 0 6px 6px 0;
            margin-bottom: 16px;
            line-height: 1.6;
            font-size: 0.92rem;
        }

        .statements div {
            margin-bottom: 4px;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #ffffff;
            border: 1.5px solid #e2e8f0;
            padding: 12px 16px;
            border-radius: 8px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--text);
            line-height: 1.4;
            -webkit-tap-highlight-color: transparent;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f8fafc;
            border-color: #94a3b8;
        }

        .option-btn.selected {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .option-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success) !important;
            color: var(--success);
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: var(--danger);
            font-weight: bold;
        }

        .result-panel {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 8px;
            display: none;
            line-height: 1.5;
        }

        .result-panel.correct {
            background-color: #f0fdf4;
            color: var(--success);
            border: 1px solid #bbf7d0;
        }

        .result-panel.wrong {
            background-color: #fef2f2;
            color: var(--danger);
            border: 1px solid #fecaca;
        }

        /* 隨題小筆記樣式：預設 display: none 隱藏 */
        .note-box {
            display: none;
            margin-top: 16px;
            background: #fffbeb;
            border: 1.5px dashed #f59e0b;
            border-radius: 8px;
            padding: 12px 14px;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: #b45309;
            margin-bottom: 6px;
        }

        .note-textarea {
            width: 100%;
            border: 1px solid #fde68a;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 0.9rem;
            line-height: 1.5;
            box-sizing: border-box;
            background: #ffffff;
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
        }

        .note-textarea:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2);
        }

        .actions {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 8px;
        }

        .action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 9px 16px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.15s;
        }

        .action-btn:hover {
            background-color: #1565c0;
        }

        .action-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .action-btn.secondary {
            background-color: #ffffff;
            color: #475569;
            border: 1.5px solid #cbd5e1;
        }

        .action-btn.secondary:hover {
            background-color: #f1f5f9;
            color: #1e293b;
            border-color: #94a3b8;
        }

        /* 筆記鈕高亮狀態（當該題已有筆記時） */
        .action-btn.has-note {
            background-color: #fef3c7;
            border-color: #f59e0b;
            color: #b45309;
        }

        .stats-bar {
            margin-top: 14px;
            font-size: 0.85rem;
            color: #64748b;
            display: flex;
            justify-content: space-between;
        }

        /* Modal 彈窗樣式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
        }

        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #475569;
        }

        .form-control {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 60px;
        }
    </style>
    <script src="questions.js"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>消化系專科醫師歷屆甄審</h1>
        <div class="header-right">
            <button class="star-btn" id="star-btn" onclick="toggleCurrentBookmark()" title="收藏至錯題本">★</button>
            <span class="badge" id="source-badge">題號資訊</span>
        </div>
    </div>

    <div class="filter-row">
        <label for="mode-select">練習範圍：</label>
        <select id="mode-select" onchange="onModeChange()">
            <option value="range">自訂年份區間</option>
            <option value="all">全部年度 (106 ~ 113)</option>
            <option value="mistakes" style="color: #b45309; font-weight: bold;">★ 我的錯題本</option>
        </select>

        <div class="range-container" id="range-box">
            <select id="start-year" onchange="onFilterChange()">
                <option value="106">106 年</option>
                <option value="107">107 年</option>
                <option value="108">108 年</option>
                <option value="109">109 年</option>
                <option value="110">110 年</option>
                <option value="111">111 年</option>
                <option value="112">112 年</option>
                <option value="113" selected>113 年</option>
            </select>
            <span>至</span>
            <select id="end-year" onchange="onFilterChange()">
                <option value="106">106 年</option>
                <option value="107">107 年</option>
                <option value="108">108 年</option>
                <option value="109">109 年</option>
                <option value="110">110 年</option>
                <option value="111">111 年</option>
                <option value="112">112 年</option>
                <option value="113" selected>113 年</option>
            </select>
        </div>

        <button class="btn-tool" onclick="exportBackupData()" title="下載包含錯題與個人筆記的備份檔">備份紀錄(含筆記)</button>
        <button class="btn-tool" onclick="document.getElementById('import-file').click()" title="載入備份紀錄">匯入備份</button>
        <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importBackupData(event)">
        <button class="btn-tool" onclick="exportUpdatedBank()" title="下載包含線上所有修改的最新題庫檔案">匯出新題庫(JS)</button>
        <button class="btn-tool danger" onclick="clearAllMistakes()">清空錯題</button>
    </div>

    <div class="question-box">
        <div class="question-title" id="question-text">載入中...</div>
        <div class="statements" id="question-statements" style="display: none;"></div>
        <div class="options-group" id="options-container"></div>
    </div>

    <div class="result-panel" id="result-box">
        <div id="result-msg"></div>
    </div>

    <!-- 隨題小筆記區塊 (預設隱藏) -->
    <div class="note-box" id="note-container">
        <div class="note-header">
            <span>📝 本題重點筆記 (輸入後自動儲存)</span>
            <span id="note-status" style="font-size: 0.75rem; color: #78350f; font-weight: normal;">已同步</span>
        </div>
        <textarea class="note-textarea" id="question-note" placeholder="在此記下臨床準則重點、關鍵鑑別或防錯提示..." oninput="onNoteInput()"></textarea>
    </div>

    <div class="actions">
        <!-- 點擊展開/收合筆記 -->
        <button class="action-btn secondary" id="toggle-note-btn" onclick="toggleNoteBox()">📝 本題筆記</button>
        <button class="action-btn secondary" id="edit-btn" onclick="openEditModal()">✏️ 編輯此題</button>
        <button class="action-btn secondary" id="skip-btn" onclick="skipQuestion()">跳過此題</button>
        <button class="action-btn" id="submit-btn" disabled>送出答案</button>
        <button class="action-btn" id="next-btn" style="display: none;">下一題</button>
    </div>

    <div class="stats-bar">
        <span id="bank-info">進度：0 / 0 題</span>
        <span id="score-box">答對率：0 / 0 (0%)</span>
    </div>
</div>

<!-- 編輯題目彈窗 Modal -->
<div class="modal" id="edit-modal">
    <div class="modal-content">
        <div class="modal-title" id="modal-header">編輯題目</div>
        
        <div class="form-group">
            <label>題目文字 (Question Body)</label>
            <textarea class="form-control" id="edit-q-text" rows="3"></textarea>
        </div>

        <div class="form-group">
            <label>子敘述 (1~5) (一行一個，無則留空)</label>
            <textarea class="form-control" id="edit-q-stmts" rows="4" placeholder="例如：&#10;(1) 極有可能出現黃疸。&#10;(2) 六十歲男性新發生黃疸..."></textarea>
        </div>

        <div class="form-group">
            <label>選項 (A~E) (一行一個)</label>
            <textarea class="form-control" id="edit-q-opts" rows="5" placeholder="例如：&#10;A. (1)+(2)&#10;B. (2)+(3)&#10;C. (3)+(4)..."></textarea>
        </div>

        <div class="form-group">
            <label>正解 (Answer)</label>
            <select class="form-control" id="edit-q-ans" style="width: 120px;">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
            </select>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px;">
            <button class="btn-tool" onclick="closeEditModal()">取消</button>
            <button class="action-btn" onclick="saveEditedQuestion()">儲存並立即更新</button>
        </div>
    </div>
</div>

<script>
let questionsBank = [];
let currentPool = [];
let remainingIndices = [];
let currentQuestion = null;
let selectedOption = null;
let stats = { total: 0, correct: 0 };

const STORAGE_KEY = "GI_EXAM_MISTAKES";
const OVERRIDES_KEY = "GI_EXAM_OVERRIDES";
const NOTES_KEY = "GI_EXAM_NOTES";

function getQuestionKey(q) {
    return `${q.year}_${q.no}`;
}

// 筆記儲存與切換顯示
function loadAllNotes() {
    try {
        return JSON.parse(localStorage.getItem(NOTES_KEY)) || {};
    } catch {
        return {};
    }
}

function saveAllNotes(notes) {
    localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
}

function toggleNoteBox() {
    const box = document.getElementById("note-container");
    const isHidden = (box.style.display === "none" || box.style.display === "");
    box.style.display = isHidden ? "block" : "none";
    if (isHidden) {
        document.getElementById("question-note").focus();
    }
}

function onNoteInput() {
    if (!currentQuestion) return;
    const key = getQuestionKey(currentQuestion);
    const val = document.getElementById("question-note").value;
    const allNotes = loadAllNotes();
    
    if (val.trim()) {
        allNotes[key] = val;
    } else {
        delete allNotes[key];
    }
    saveAllNotes(allNotes);
    updateNoteButtonUI();
    
    const status = document.getElementById("note-status");
    status.innerText = "已自動儲存";
    setTimeout(() => { status.innerText = "已同步"; }, 1000);
}

function updateNoteButtonUI() {
    if (!currentQuestion) return;
    const key = getQuestionKey(currentQuestion);
    const allNotes = loadAllNotes();
    const btn = document.getElementById("toggle-note-btn");
    
    if (allNotes[key] && allNotes[key].trim()) {
        btn.classList.add("has-note");
        btn.innerText = "📝 筆記 (已有內容)";
    } else {
        btn.classList.remove("has-note");
        btn.innerText = "📝 本題筆記";
    }
}

// 題目覆蓋修正邏輯
function loadOverrides() {
    try {
        return JSON.parse(localStorage.getItem(OVERRIDES_KEY)) || {};
    } catch {
        return {};
    }
}

function saveOverrides(data) {
    localStorage.setItem(OVERRIDES_KEY, JSON.stringify(data));
}

function buildMergedBank() {
    if (typeof rawQuestions === "undefined" || !rawQuestions.length) return [];
    const overrides = loadOverrides();
    return rawQuestions.map(q => {
        const key = getQuestionKey(q);
        if (overrides[key]) {
            return { ...q, ...overrides[key] };
        }
        return q;
    });
}

// 錯題本邏輯
function getMistakeKeys() {
    try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
        return [];
    }
}

function saveMistakeKeys(keys) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(keys));
    updateMistakesOptionText();
}

function isBookmarked(q) {
    if (!q) return false;
    const list = getMistakeKeys();
    return list.includes(getQuestionKey(q));
}

function toggleCurrentBookmark() {
    if (!currentQuestion) return;
    const key = getQuestionKey(currentQuestion);
    let list = getMistakeKeys();
    if (list.includes(key)) {
        list = list.filter(k => k !== key);
    } else {
        list.push(key);
    }
    saveMistakeKeys(list);
    updateStarUI();

    if (document.getElementById("mode-select").value === "mistakes") {
        filterPool();
        loadRandomQuestion();
    }
}

function addCurrentToMistakes() {
    if (!currentQuestion) return;
    const key = getQuestionKey(currentQuestion);
    let list = getMistakeKeys();
    if (!list.includes(key)) {
        list.push(key);
        saveMistakeKeys(list);
        updateStarUI();
    }
}

// 備份與匯入
function exportBackupData() {
    const mistakes = getMistakeKeys();
    const notes = loadAllNotes();
    
    const backupObj = {
        mistakes: mistakes,
        notes: notes,
        exportedAt: new Date().toISOString()
    };
    
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupObj, null, 2));
    const downloadAnchor = document.createElement("a");
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `gi_exam_backup_${new Date().toISOString().slice(0, 10)}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}

function importBackupData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const imported = JSON.parse(e.target.result);
            let importedMistakes = [];
            let importedNotes = {};

            if (Array.isArray(imported)) {
                importedMistakes = imported;
            } else if (imported && typeof imported === "object") {
                importedMistakes = imported.mistakes || [];
                importedNotes = imported.notes || {};
            }

            const currentMistakes = getMistakeKeys();
            const currentNotes = loadAllNotes();

            const shouldMerge = confirm(`成功讀取備份檔！\n錯題：${importedMistakes.length} 筆\n筆記：${Object.keys(importedNotes).length} 筆\n\n按「確定」與目前資料【合併】\n按「取消」將【覆蓋】目前資料`);

            if (shouldMerge) {
                saveMistakeKeys(Array.from(new Set([...currentMistakes, ...importedMistakes])));
                saveAllNotes({ ...currentNotes, ...importedNotes });
            } else {
                saveMistakeKeys(importedMistakes);
                saveAllNotes(importedNotes);
            }

            alert("備份資料載入完成！");
            
            if (document.getElementById("mode-select").value === "mistakes") {
                filterPool();
                loadRandomQuestion();
            } else {
                updateStarUI();
                renderCurrentQuestionUI();
            }
        } catch (err) {
            alert("匯入失敗：請確認檔案格式是否正確！");
        }
        event.target.value = "";
    };
    reader.readAsText(file);
}

function clearAllMistakes() {
    if (confirm("確定要清空所有已收藏的錯題嗎？(您的個人小筆記仍會妥善保留)")) {
        localStorage.removeItem(STORAGE_KEY);
        updateMistakesOptionText();
        if (document.getElementById("mode-select").value === "mistakes") {
            filterPool();
            loadRandomQuestion();
        } else {
            updateStarUI();
        }
    }
}

function updateMistakesOptionText() {
    const count = getMistakeKeys().length;
    const opt = document.querySelector("#mode-select option[value='mistakes']");
    if (opt) {
        opt.innerText = `★ 我的錯題本 (${count} 題)`;
    }
}

function updateStarUI() {
    const starBtn = document.getElementById("star-btn");
    if (isBookmarked(currentQuestion)) {
        starBtn.classList.add("bookmarked");
        starBtn.title = "已在錯題本中 (點擊取消)";
    } else {
        starBtn.classList.remove("bookmarked");
        starBtn.title = "加入錯題本";
    }
}

// 題目線上編輯器
function openEditModal() {
    if (!currentQuestion) return;
    document.getElementById("modal-header").innerText = `✏️ 編輯 ${currentQuestion.year} 第 ${currentQuestion.no} 題`;
    document.getElementById("edit-q-text").value = currentQuestion.question || "";
    document.getElementById("edit-q-stmts").value = (currentQuestion.statements || []).join("\n");
    document.getElementById("edit-q-opts").value = (currentQuestion.options || []).join("\n");
    document.getElementById("edit-q-ans").value = (currentQuestion.answer || "A").trim().toUpperCase();

    document.getElementById("edit-modal").style.display = "flex";
}

function closeEditModal() {
    document.getElementById("edit-modal").style.display = "none";
}

function saveEditedQuestion() {
    if (!currentQuestion) return;
    const key = getQuestionKey(currentQuestion);

    const newQuestion = document.getElementById("edit-q-text").value.trim();
    const newStatements = document.getElementById("edit-q-stmts").value.split("\n").map(s => s.trim()).filter(Boolean);
    const newOptions = document.getElementById("edit-q-opts").value.split("\n").map(s => s.trim()).filter(Boolean);
    const newAnswer = document.getElementById("edit-q-ans").value.trim().toUpperCase();

    if (!newQuestion || newOptions.length < 2) {
        alert("請至少填寫題目文字與 2 個以上的選項！");
        return;
    }

    const overrides = loadOverrides();
    overrides[key] = {
        question: newQuestion,
        statements: newStatements,
        options: newOptions,
        answer: newAnswer
    };
    saveOverrides(overrides);

    Object.assign(currentQuestion, overrides[key]);
    const idx = questionsBank.findIndex(q => getQuestionKey(q) === key);
    if (idx !== -1) {
        Object.assign(questionsBank[idx], overrides[key]);
    }

    closeEditModal();
    renderCurrentQuestionUI();
    alert("修改已儲存！");
}

function exportUpdatedBank() {
    if (!questionsBank.length) return;
    const jsContent = "const rawQuestions = " + JSON.stringify(questionsBank, null, 2) + ";\n";
    const dataStr = "data:text/javascript;charset=utf-8," + encodeURIComponent(jsContent);
    const downloadAnchor = document.createElement("a");
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `questions.js`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}

function initBank() {
    questionsBank = buildMergedBank();
    if (!questionsBank.length) {
        alert("找不到 questions.js 或題庫內容為空！請確保 questions.js 與此 html 放在同一資料夾中。");
        return;
    }
    updateMistakesOptionText();
    onModeChange();
}

function onModeChange() {
    const mode = document.getElementById("mode-select").value;
    const rangeBox = document.getElementById("range-box");
    rangeBox.style.display = (mode === "range") ? "inline-flex" : "none";
    onFilterChange();
}

function onFilterChange() {
    filterPool();
    loadRandomQuestion();
}

function filterPool() {
    const mode = document.getElementById("mode-select").value;

    if (mode === "all") {
        currentPool = [...questionsBank];
    } else if (mode === "mistakes") {
        const mistakeKeys = getMistakeKeys();
        currentPool = questionsBank.filter(q => mistakeKeys.includes(getQuestionKey(q)));
    } else if (mode === "range") {
        const y1 = parseInt(document.getElementById("start-year").value, 10);
        const y2 = parseInt(document.getElementById("end-year").value, 10);
        const minYear = Math.min(y1, y2);
        const maxYear = Math.max(y1, y2);

        currentPool = questionsBank.filter(q => {
            const m = q.year.match(/\d{3}/);
            if (!m) return false;
            const y = parseInt(m[0], 10);
            return y >= minYear && y <= maxYear;
        });
    }

    shuffleRemaining();
    updateProgressUI();
}

function shuffleRemaining() {
    remainingIndices = currentPool.map((_, idx) => idx);
    for (let i = remainingIndices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [remainingIndices[i], remainingIndices[j]] = [remainingIndices[j], remainingIndices[i]];
    }
}

function updateProgressUI() {
    const total = currentPool.length;
    const remaining = remainingIndices.length;
    const done = total - remaining;
    document.getElementById("bank-info").innerText = `進度：${done} / ${total} 題 (剩餘 ${remaining} 題)`;
}

function skipQuestion() {
    loadRandomQuestion();
}

function renderCurrentQuestionUI() {
    if (!currentQuestion) return;

    document.getElementById("source-badge").innerText = `${currentQuestion.year} 第 ${currentQuestion.no} 題`;
    document.getElementById("question-text").innerText = currentQuestion.question;

    const stmtBox = document.getElementById("question-statements");
    if (currentQuestion.statements && currentQuestion.statements.length > 0) {
        stmtBox.innerHTML = currentQuestion.statements.map(s => `<div>${s}</div>`).join("");
        stmtBox.style.display = "block";
    } else {
        stmtBox.style.display = "none";
    }

    const optContainer = document.getElementById("options-container");
    optContainer.innerHTML = "";

    currentQuestion.options.forEach((optText) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = optText;
        const optKey = optText.trim().charAt(0).toUpperCase();

        btn.onclick = () => {
            document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            selectedOption = optKey;
            document.getElementById("submit-btn").disabled = false;
        };

        optContainer.appendChild(btn);
    });

    // 載入筆記內容（預設收合框隱藏）
    const key = getQuestionKey(currentQuestion);
    const allNotes = loadAllNotes();
    document.getElementById("question-note").value = allNotes[key] || "";
    document.getElementById("note-status").innerText = "已同步";
    document.getElementById("note-container").style.display = "none";
    updateNoteButtonUI();
}

function loadRandomQuestion() {
    if (currentPool.length === 0) {
        const mode = document.getElementById("mode-select").value;
        document.getElementById("question-text").innerText = (mode === "mistakes")
            ? "太棒了！錯題本內目前沒有任何題目。"
            : "所選年份區間內目前無符合之題目。";
        document.getElementById("question-statements").style.display = "none";
        document.getElementById("options-container").innerHTML = "";
        document.getElementById("source-badge").innerText = "無題目";
        document.getElementById("submit-btn").style.display = "none";
        document.getElementById("skip-btn").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("edit-btn").style.display = "none";
        document.getElementById("toggle-note-btn").style.display = "none";
        document.getElementById("note-container").style.display = "none";
        document.getElementById("result-box").style.display = "none";
        updateStarUI();
        updateProgressUI();
        return;
    }

    if (remainingIndices.length === 0) {
        alert("🎉 太強了！所選範圍內的題目已全數刷完一輪！系統已為您重新洗牌，即將展開新的一輪。");
        shuffleRemaining();
    }

    selectedOption = null;
    document.getElementById("submit-btn").disabled = true;
    document.getElementById("submit-btn").style.display = "inline-block";
    document.getElementById("skip-btn").style.display = "inline-block";
    document.getElementById("edit-btn").style.display = "inline-block";
    document.getElementById("toggle-note-btn").style.display = "inline-block";
    document.getElementById("next-btn").style.display = "none";
    document.getElementById("result-box").style.display = "none";

    const nextIdx = remainingIndices.pop();
    currentQuestion = currentPool[nextIdx];

    updateStarUI();
    updateProgressUI();
    renderCurrentQuestionUI();
}

function checkAnswer() {
    if (!selectedOption) return;

    stats.total++;
    const isCorrect = (selectedOption === currentQuestion.answer.toUpperCase());
    if (isCorrect) stats.correct++;

    if (!isCorrect) {
        addCurrentToMistakes();
    }

    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach(btn => {
        btn.disabled = true;
        const optKey = btn.innerText.trim().charAt(0).toUpperCase();
        if (optKey === currentQuestion.answer.toUpperCase()) {
            btn.classList.add("correct");
        } else if (optKey === selectedOption && !isCorrect) {
            btn.classList.add("wrong");
        }
    });

    const resultBox = document.getElementById("result-box");
    const resultMsg = document.getElementById("result-msg");
    resultBox.style.display = "block";

    if (isCorrect) {
        resultBox.className = "result-panel correct";
        resultMsg.innerHTML = `<strong>回答正確！</strong> 正確答案為 <b>${currentQuestion.answer}</b>。`;
    } else {
        resultBox.className = "result-panel wrong";
        resultMsg.innerHTML = `<strong>回答錯誤！</strong> 您的答案是 ${selectedOption}，正確答案為 <b>${currentQuestion.answer}</b>。<br><small style="color: #991b1b;">(已自動將此題存入「錯題本」)</small>`;
    }

    const rate = Math.round((stats.correct / stats.total) * 100);
    document.getElementById("score-box").innerText = `答對率：${stats.correct} / ${stats.total} (${rate}%)`;

    document.getElementById("submit-btn").style.display = "none";
    document.getElementById("skip-btn").style.display = "none";
    document.getElementById("next-btn").style.display = "inline-block";
}

document.getElementById("submit-btn").onclick = checkAnswer;
document.getElementById("next-btn").onclick = () => {
    loadRandomQuestion();
};

window.onload = initBank;
</script>

</body>
</html>
